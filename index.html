<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub 学習記録</title>
</head>
<body>

    <h2>記録</h2>

    <div id="message">
        読み込み中...
    </div>

    <script>
        fetch("data.txt")
            .then(response => response.text())
            .then(text => {
                document.getElementById("message").textContent = text;
            });
    </script>

</body>
</html>
